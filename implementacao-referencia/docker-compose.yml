services:
  postgres:
    image: postgres:17-alpine
    container_name: termos-uso-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: termos_uso
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d termos_uso"]
      interval: 2s
      timeout: 3s
      retries: 15
